[project]
name = "project-atlas"
version = "0.1.0"
description = "Multi-agent research and exploration orchestrator"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/atlas"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == __main__:",
]
fail_under = 80
precision = 2

[tool.coverage.html]
directory = "htmlcov"
